ignoredBuiltDependencies:
  - sharp
  - unrs-resolver

# Supply-chain hardening: only install dependency versions (transitive included)
# that have been published for at least 7 days, so compromised/malicious
# publishes are caught before we pull them in. Urgent security bumps can bypass
# this via minimumReleaseAgeExclude or a pnpm.overrides entry.
minimumReleaseAge: 10080 # minutes = 7 days

overrides:
  "axios@>=1.0.0 <1.20.0": ^1.20.0
  "qs@>=2.2.5 <6.16.0": ^6.16.0
  "postcss@<8.5.23": ^8.5.23
  "undici@>=7.0.0 <7.29.1": ^7.29.1
  "js-yaml@>=4.0.0 <4.3.2": ^4.3.2
  "nanoid@<3.3.18": ^3.3.18
  "brace-expansion@<1.1.21": ^1.1.21
  "form-data@>=4.0.0 <4.0.6": ^4.0.6
  "source-map-js@>=1.0.0 <1.2.2": ^1.2.2

# source-map-js 1.2.2 fixes GHSA-68fv-2mgg-jv7q and is younger than the 7-day
# window. Drop this once it ages past it.
minimumReleaseAgeExclude:
  - source-map-js@1.2.2
